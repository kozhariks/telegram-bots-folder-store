name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

# Public repo: macOS minutes are free (with fair-use limits).
# Produces an unsigned IPA (fake-codesigning), same approach as TelegramMessenger/Telegram-iOS CI.
# Sideload with your Apple ID (AltStore / Sideloadly) or resign for TestFlight.

env:
  TELEGRAM_IOS_REF: '24638bc69bd083981b178dd1e7f921eebbf7fc46'
  SOURCE_DIR: /Users/Shared/telegram-ios

jobs:
  ios:
    # Telegram-iOS tip needs Icon Composer (.icon) → Xcode 26+.
    # macos-15 defaults to Xcode 16.4 and fails analysis; macos-26 ships Xcode 26.6.
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout feature repo
        uses: actions/checkout@v4
        with:
          path: feature

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Developer/CoreSimulator || true
          # Drop unused Xcode 26.x copies except the one we select later — reclaim tens of GB.
          brew cleanup -s || true
          df -h /

      - name: Clone Telegram-iOS (shallow + submodules)
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          sudo chown -R "$(whoami)" /Users/Shared
          git init "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$TELEGRAM_IOS_REF"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          echo "Checked out $(git rev-parse HEAD)"
          df -h /

      - name: Apply bots-folder feature
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          # Copy full Feature tree (new + modified files). More reliable than git apply on CI.
          cp -R "$GITHUB_WORKSPACE/feature/ios/Feature/submodules/." submodules/
          echo "Feature files overlayed:"
          find "$GITHUB_WORKSPACE/feature/ios/Feature" -type f | sed "s|$GITHUB_WORKSPACE/feature/ios/Feature/||"
          # Optional: verify patch still applies cleanly for local docs
          if git apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/feature/ios/Integration/telegram-ios.patch"; then
            echo "Integration patch checks clean against base (informational)."
          else
            echo "Integration patch check failed (ok if Feature overlay already contains full files)."
          fi
          df -h /

      - name: Write build configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          if [[ -z "${API_ID}" || -z "${API_HASH}" ]]; then
            echo "Missing secrets TELEGRAM_API_ID / TELEGRAM_API_HASH" >&2
            exit 1
          fi
          # bundle_id + team_id must match build-system/fake-codesigning profiles
          # (same as upstream Telegram-iOS CI / appstore-configuration.json).
          cat > "$SOURCE_DIR/build-system/tezam-configuration.json" <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${API_ID}",
            "api_hash": "${API_HASH}",
            "team_id": "C67CF9S4VU",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      # Device IPA needs provisioning_profile. Upstream fake profiles expired 2026-10-30;
      # Make.py decodes them via `openssl smime -verify`, so we must re-CMS-sign after
      # bumping ExpirationDate (in-place XML edits break the signature).
      - name: Extend and re-sign fake provisioning profiles
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          PROFILES_DIR="build-system/fake-codesigning/profiles"
          P12="build-system/fake-codesigning/certs/SelfSigned.p12"
          PEM="$RUNNER_TEMP/telegram-fake.pem"
          NEW_EXPIRY="2028-12-31T23:59:59Z"
          # Extract cert+key (OpenSSL 3 may need -legacy for older p12).
          if ! openssl pkcs12 -in "$P12" -nodes -passin pass: -out "$PEM" 2>/dev/null; then
            openssl pkcs12 -in "$P12" -nodes -passin pass: -legacy -out "$PEM"
          fi
          for profile in "$PROFILES_DIR"/*.mobileprovision; do
            plist="$(mktemp)"
            out="$(mktemp)"
            openssl smime -inform der -verify -noverify -in "$profile" -out "$plist"
            plutil -convert xml1 "$plist"
            plutil -replace ExpirationDate -date "$NEW_EXPIRY" "$plist"
            openssl smime -sign -signer "$PEM" -inkey "$PEM" -nodetach -outform der -in "$plist" -out "$out"
            # Sanity: Make.py uses the same decode path
            openssl smime -inform der -verify -noverify -in "$out" >/dev/null
            mv "$out" "$profile"
            rm -f "$plist"
            echo "re-signed $(basename "$profile")"
          done
          rm -f "$PEM"
          # Confirm decoded date
          openssl smime -inform der -verify -noverify -in "$PROFILES_DIR/Intents.mobileprovision" \
            | plutil -extract ExpirationDate raw -o - -

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i Xcode || true
          WANT=$(python3 -c 'import json; print(json.load(open("'"$SOURCE_DIR"'/versions.json"))["xcode"])')
          # Prefer exact versions.json match, else newest Xcode 27/26 (Icon Composer requires ≥26).
          SELECTED=""
          for cand in \
            "Xcode_${WANT}.app" \
            "Xcode_27.1.app" "Xcode_27.0.app" "Xcode_27.app" \
            "Xcode_26.6.app" "Xcode_26.5.app" "Xcode_26.4.1.app" "Xcode_26.4.app" \
            "Xcode_26.3.app" "Xcode_26.2.app" "Xcode_26.1.1.app" "Xcode_26.0.1.app" \
            "Xcode.app"
          do
            if [[ -d "/Applications/${cand}" ]]; then
              SELECTED="/Applications/${cand}"
              break
            fi
          done
          if [[ -z "$SELECTED" ]]; then
            echo "No suitable Xcode ≥26 found" >&2
            exit 1
          fi
          echo "Using $SELECTED"
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          # dav1d arm64-iPhoneOS.meson hardcodes /Applications/Xcode.app — keep that path.
          sudo rm -f /Applications/Xcode.app
          sudo ln -sfn "$SELECTED" /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          # Free disk: drop unused Xcode_* copies (never delete the selected realpath / Xcode.app).
          SELECTED_REAL="$(cd "$SELECTED" && pwd -P)"
          for app in /Applications/Xcode_*.app; do
            [[ -e "$app" ]] || continue
            app_real="$(cd "$app" && pwd -P)"
            if [[ "$app_real" == "$SELECTED_REAL" ]]; then
              continue
            fi
            echo "Removing $app to free disk"
            sudo rm -rf "$app" || true
          done
          # Ensure symlink still present after cleanup
          ls -la /Applications/Xcode.app
          test -d /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform
          df -h /

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_telegram_bots"
          BUILD_NUMBER="${{ github.run_number }}"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs || true
          # Match upstream Telegram-iOS CI: fake-codesigning → unsigned IPA.
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/tezam-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          mkdir -p "$OUTPUT_PATH"
          shopt -s nullglob
          IPAS=(bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa)
          if [[ ${#IPAS[@]} -eq 0 ]]; then
            # Fallback: any Telegram.ipa under bazel-out
            IPAS=( $(find bazel-out -name 'Telegram.ipa' 2>/dev/null | head -n 5) )
          fi
          if [[ ${#IPAS[@]} -eq 0 ]]; then
            echo "No IPA produced" >&2
            find bazel-out -name '*.ipa' 2>/dev/null | head || true
            df -h /
            exit 1
          fi
          cp "${IPAS[0]}" "$OUTPUT_PATH/Telegram-bots-folder.ipa"
          ls -lh "$OUTPUT_PATH"
          echo "IPA_PATH=$OUTPUT_PATH/Telegram-bots-folder.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bots-folder-ios
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram-bots-folder.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-ios-${{ github.run_number }}"
          gh release create "$TAG" \
            /Users/Shared/telegram-ios/build/artifacts/Telegram-bots-folder.ipa \
            --repo "${{ github.repository }}" \
            --title "v0.1.0 — iOS unsigned IPA (#${{ github.run_number }})" \
            --notes "$(cat <<'EOF'
          ## iOS
          Unsigned IPA (fake-codesigning), same style as official Telegram-iOS CI.

          Install via Sideloadly / AltStore / your Apple Developer resign.

          ## Android
          See [v0.1.0-android](https://github.com/kozhariks/telegram-bots-folder-store/releases/tag/v0.1.0-android).
          EOF
          )"
